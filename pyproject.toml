[project]
name = "xslm"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.5",
    "transformers>=4.45",
    "tokenizers>=0.20",
    "datasets>=3.0",
    "accelerate>=1.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.26",
    "wandb>=0.18",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xslm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

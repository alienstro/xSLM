model:
  hidden_size: 640
  num_hidden_layers: 10
  num_attention_heads: 10
  num_key_value_heads: 10
  intermediate_size: 1728
  vocab_size: 32768
  max_position_embeddings: 1024
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  initializer_range: 0.02
  tie_word_embeddings: true

tokenizer:
  vocab_size: 32768
  sample_bytes: 2000000000
  output_path: data/tokenizer.json

data:
  dataset: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  train_path: data/train.bin
  val_path: data/val.bin
  val_tokens: 5000000
  target_tokens: 900000000

training:
  output_dir: out
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-3
  min_learning_rate: 1.0e-4
  warmup_steps: 200
  max_steps: 2400
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: false
  torch_compile: false
  dataloader_num_workers: 4
  logging_steps: 10
  eval_steps: 250
  save_steps: 250
  save_total_limit: 2
  sample_every_steps: 500
  time_limit_minutes: 180
  seed: 1337

publish:
  model_name: xslm-70m
  quant_types:
    - Q8_0
    - Q6_K
    - Q4_K_M

instruct:
  dataset: databricks/databricks-dolly-15k
  base_model: Alienstro/xslm
  output_dir: out/instruct
  max_length: 512
  val_pairs: 300
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  # The model already reads English. This stage teaches one behaviour, so the rate
  # stays about a hundred times under the rate of the pretraining run. A larger
  # rate makes the model forget the language, which is catastrophic forgetting.
  learning_rate: 2.0e-5
  min_learning_rate: 2.0e-6
  warmup_steps: 40
  num_train_epochs: 3
  weight_decay: 0.0
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
  save_total_limit: 1
  time_limit_minutes: 45
  seed: 1337
